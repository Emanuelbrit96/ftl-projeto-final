<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UBS e USF em Salvador</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="mapa.css">

  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="app.js"></script>
</head>

<body>
  <header>
    <h1>UBS e USF em Salvador</h1>
    <p id="status" role="status">Carregando as Prefeituras-Bairro…</p>
    <button id="ver-tudo" type="button" disabled>
      Ver Salvador inteiro
    </button>
  </header>

  <div class="conteudo-mapa">
    <aside id="painel-regiao" aria-live="polite">
      <h2>Região selecionada</h2>
      <p>Clique em uma Prefeitura-Bairro para consultar os indicadores.</p>
    </aside>

    <main id="mapa"
          aria-label="Mapa das Prefeituras-Bairro de Salvador">
    </main>
  </div>
</body>
</html>
